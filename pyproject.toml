[project]
name = "gujrera-tracker"
version = "0.1.0"
description = "GUJRERA project tracker — Phase 1: scrape, search, alert on Gujarat RERA project approvals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "asgi-lifespan>=2.1",
]
scraper = [
    "playwright>=1.47",
    "playwright-stealth>=1.0.6",
    "pandas>=2.2",
    "resend>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "scraper", "db"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
